<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Limpieza TV y Radio</title>
<meta name="description" content="Responde unas preguntas y recibe la guía paso a paso para limpiar una TV Android o un radio de auto desde Windows o Mac.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. A question card at a time, then a personalised checklist of steps built from the answers. Dark-first, same identity as the Clear TV tutorials. */
:root{
  --bg:#050b1c; --surface:#0b1630; --surface-2:#10204a; --line:#1f3266;
  --fg:#eef3fb; --muted:#9fb0cf; --accent:#31b4e7; --accent-2:#5fd8ca;
  --warn:#ff7700; --alert:#ea0029; --code-bg:#030814; --code-fg:#cfe9ff;
  --display:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#e7eef9; --line:#c9d6ec;
  --fg:#0b1736; --muted:#4c5f80; --accent:#0a74b8; --accent-2:#11806f;
  --warn:#b24f00; --alert:#c1001f; --code-bg:#0b1736; --code-fg:#e3f2ff; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#e7eef9; --line:#c9d6ec;
  --fg:#0b1736; --muted:#4c5f80; --accent:#0a74b8; --accent-2:#11806f;
  --warn:#b24f00; --alert:#c1001f; --code-bg:#0b1736; --code-fg:#e3f2ff; color-scheme:light }

html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:20}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}

.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 96px;display:grid;gap:28px}
.wrap > *{min-width:0}

.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.eyebrow b{font-weight:500;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:300;text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(36px,6.5vw,64px);line-height:1.04}
h2{font-size:clamp(26px,4vw,38px);line-height:1.12}
h3{font-size:19px;font-weight:400;letter-spacing:-.01em}
p{margin:0;max-width:65ch}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:58ch}
.muted{color:var(--muted)}
a{color:var(--accent)}
strong{font-weight:600}
ul.plain{margin:0;padding-left:20px;display:grid;gap:6px}
.path,code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border-radius:6px;padding:1px 7px;overflow-wrap:anywhere}

.head{display:grid;gap:14px}

.qcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:clamp(18px,3vw,30px);display:grid;gap:18px}
.qmeta{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:2px 12px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,a:focus-visible,.chip:focus-visible,.cmd button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.opt .mark{grid-row:1 / span 2;width:20px;height:20px;margin-top:3px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;line-height:1}
.opt.multi .mark{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
.opt[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt .ot{font-weight:500}
.opt .os{color:var(--muted);font-size:14px;grid-column:2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

.sum{display:grid;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 20px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}

.step{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:clamp(16px,3vw,26px);display:grid;gap:14px}
.step.done{opacity:.55}
.step .sh{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center}
.step .num{font-family:var(--display);font-size:19px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent)}
.step .sb{display:grid;gap:12px}
.step .sb > *{min-width:0}
.donelbl{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);cursor:pointer;width:max-content}
.donelbl input{width:18px;height:18px;accent-color:var(--accent)}

.cmd{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:10px;border:1px solid var(--line);display:flex;align-items:stretch;min-width:0}
.cmd pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55;overflow-x:auto;flex:1;min-width:0;white-space:pre}
.cmd button{flex:none;border:0;border-left:1px solid #1f3266;background:transparent;color:#9fd6f3;font-family:var(--mono);font-size:12px;padding:0 14px;cursor:pointer;border-radius:0 10px 10px 0}
.cmd button:hover{background:#0f2147}

.note{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.note.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.note.warn .tag{color:var(--warn)}
.note.alert{border-color:color-mix(in srgb,var(--alert) 55%,var(--line))}
.note.alert .tag{color:var(--alert)}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface)}
tr:last-child td{border-bottom:0}
td code{font-size:.85em}
</style>
</head>
<body>

<div class="progress" aria-hidden="true"><span id="pbar"></span></div>
<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';
var KEY = 'limpieza-tv-radio-v1';
var IP = '192.168.1.50';

/* ---------- helpers ---------- */
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function mkCmd(text){
  var d = el('div', 'cmd'), pre = el('pre'), b = el('button'); pre.textContent = text;
  b.type = 'button'; b.textContent = 'Copiar'; b.setAttribute('aria-label', 'Copiar comando');
  b.addEventListener('click', function(){
    function selectIt(){ var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Seleccionado'; }
    function done(){ b.textContent = 'Copiado'; setTimeout(function(){ b.textContent = 'Copiar'; }, 1600); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, selectIt); else selectIt(); } catch (e) { selectIt(); }
  });
  d.appendChild(pre); d.appendChild(b); return d;
}
function mkBlock(b){
  if (b.p) return el('p', null, b.p);
  if (b.muted) return el('p', 'muted', b.muted);
  if (b.h) return el('h3', null, b.h);
  if (b.cmd) return mkCmd(b.cmd);
  if (b.list){ var ul = el('ul', 'plain'); b.list.forEach(function(x){ ul.appendChild(el('li', null, x)); }); return ul; }
  if (b.note){ var n = el('div', 'note ' + (b.note === 'info' ? '' : b.note)); n.appendChild(el('span', 'tag', b.tag || '')); n.appendChild(el('p', null, b.html)); return n; }
  if (b.table){
    var w = el('div', 'table-wrap'), t = el('table'), th = el('thead'), tr = el('tr');
    b.table.head.forEach(function(h){ tr.appendChild(el('th', null, h)); }); th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody'); b.table.rows.forEach(function(r){ var x = el('tr'); r.forEach(function(c){ x.appendChild(el('td', null, c)); }); tb.appendChild(x); });
    t.appendChild(tb); w.appendChild(t); return w;
  }
  return el('span');
}

/* ---------- preguntas ---------- */
var Q = [
 { id:'device', t:'¿Qué quieres limpiar?', h:'Elige uno. Si tienes los dos, termina con uno y vuelve a empezar con el otro.', opts:function(){ return [
   { v:'tv', t:'Un televisor', s:'Google TV, Android TV o Fire TV', c:'Televisor' },
   { v:'car', t:'Un radio de auto', s:'La pantalla del tablero: Android, Android Automotive, CarPlay o Android Auto', c:'Radio de auto' } ]; } },

 { id:'tvsys', when:function(a){ return a.device === 'tv'; }, t:'¿Qué sistema tiene tu TV?', h:'Se ve en el menú de inicio o en Ajustes → Sistema → Información.', opts:function(){ return [
   { v:'android', t:'Google TV o Android TV', s:'TCL, Sony, Xiaomi, Hisense con Google, Philips y más', c:'Google TV / Android TV' },
   { v:'fire', t:'Fire TV', s:'Amazon Fire TV o televisor con Fire OS. Solo se puede limpiar, no cambiar el inicio', c:'Fire TV' },
   { v:'other', t:'Samsung, LG, Roku, Vizio o Hisense VIDAA', s:'Estos sistemas no usan adb', c:'TV no Android', stop:'tv-other' },
   { v:'unknown', t:'No sé cuál es', s:'Te ayudo a averiguarlo', c:'Sistema desconocido', stop:'tv-unknown' } ]; } },

 { id:'brand', when:function(a){ return a.device === 'tv' && a.tvsys === 'android'; }, t:'¿De qué marca es?', h:'Algunas marcas necesitan cuidados especiales.', opts:function(){ return [
   { v:'tclframe', t:'TCL tipo cuadro (Frame)', s:'Modo arte: hay un servicio que no se debe apagar', c:'TCL Frame' },
   { v:'tcl', t:'TCL normal', c:'TCL' },
   { v:'other', t:'Otra marca', s:'Sony, Xiaomi, Hisense, Philips u otra', c:'Otra marca' } ]; } },

 { id:'conn', when:function(a){ return a.device === 'tv' && a.tvsys === 'android'; }, t:'¿Cómo está conectada hoy tu TV a internet?', h:'La "Depuración inalámbrica" solo se enciende con la TV en Wi-Fi.', opts:function(){ return [
   { v:'wifi', t:'Por Wi-Fi', c:'TV por Wi-Fi' },
   { v:'eth', t:'Por cable de red', s:'La pasaremos a Wi-Fi mientras dura el trabajo', c:'TV por cable' } ]; } },

 { id:'tvgoal', when:function(a){ return a.device === 'tv' && a.tvsys === 'android'; }, t:'¿Qué quieres lograr?', h:'El cambio de pantalla de inicio agrega varios pasos y herramientas extra.', opts:function(){ return [
   { v:'clean', t:'Solo limpiar', s:'Quitar anuncios, rastreo y apps que no usas', c:'Solo limpiar' },
   { v:'launcher', t:'Limpiar y cambiar la pantalla de inicio', s:'Inicio limpio estilo Apple TV, con tus fotos de fondo', c:'Limpiar + inicio nuevo' } ]; } },

 { id:'cartype', when:function(a){ return a.device === 'car'; }, t:'¿Qué tipo de radio tienes?', h:'Elige la opción que más se parezca. Si dudas, elige la última.', opts:function(){ return [
   { v:'aftermarket', t:'Radio Android instalado después de comprar el auto', s:'Pantalla grande tipo tablet, con Play Store o ajustes de Android (marcas como Xtrons, Eonon, Erisin)', c:'Radio Android' },
   { v:'aaos', t:'Auto con Android Automotive de fábrica', s:'Volvo, Polestar, GM, Renault y similares, con Google integrado', c:'Android Automotive' },
   { v:'phoneonly', t:'Solo CarPlay o Android Auto', s:'El radio solo muestra lo que viene del celular', c:'CarPlay / Android Auto', stop:'car-phone' },
   { v:'unknown', t:'No sé cuál es', s:'Te ayudo a averiguarlo', c:'Radio desconocido', stop:'car-unknown' } ]; } },

 { id:'carlink', when:function(a){ return a.device === 'car' && (a.cartype === 'aftermarket' || a.cartype === 'aaos'); }, t:'¿Cómo piensas conectar el radio al computador?', h:'Depende de la versión de Android del radio.', opts:function(){ return [
   { v:'wifi', t:'Por Wi-Fi', s:'Si en Opciones de desarrollador existe "Depuración inalámbrica" (Android 11 o más nuevo)', c:'Conexión Wi-Fi' },
   { v:'usb', t:'Por cable USB', s:'Si el radio es más antiguo o no tiene depuración inalámbrica', c:'Conexión USB' },
   { v:'unknown', t:'No sé', s:'La guía te dice cómo comprobarlo y te da las dos rutas', c:'Conexión: por comprobar' } ]; } },

 { id:'cargoal', type:'multi', min:1, when:function(a){ return a.device === 'car' && a.cartype === 'aftermarket'; }, t:'¿Qué quieres hacer?', h:'Puedes marcar más de uno. Cada opción agrega sus pasos.', opts:function(){ return [
   { v:'apps', t:'Desactivar apps y promociones que no uso', s:'Siempre de una en una y con forma de deshacer', c:'Desactivar apps' },
   { v:'install', t:'Instalar apps desde un archivo APK', c:'Instalar apps' },
   { v:'launcher', t:'Cambiar la pantalla de inicio por otra táctil', s:'Sin desactivar la original', c:'Cambiar inicio' } ]; } },

 { id:'os', t:'¿Qué computador vas a usar?', h:'Los comandos cambian según el sistema.', opts:function(){ return [
   { v:'win', t:'Notebook o PC con Windows', s:'Windows 10 u 11, con PowerShell', c:'Windows' },
   { v:'mac', t:'Mac', s:'Con la app Terminal', c:'Mac' } ]; } },

 { id:'tools', type:'multi', min:0, t:'¿Qué tienes ya instalado en el computador?', h:'Marca lo que ya tienes. Si no sabes o no tienes nada, déjalo sin marcar y sigue.', opts:function(a){
   var launcher = (a.device === 'tv' && a.tvsys === 'android' && a.tvgoal === 'launcher');
   var tv = a.device === 'tv', out = [];
   if (a.os === 'win'){
     if (tv){ out.push({ v:'python', t:'Python 3' }); out.push({ v:'git', t:'Git' }); }
     out.push({ v:'adb', t:'adb (herramientas de plataforma de Android)' });
     if (launcher) out.push({ v:'studio', t:'Android Studio' });
   } else {
     out.push({ v:'brew', t:'Homebrew' });
     out.push({ v:'adb', t:'adb (herramientas de plataforma de Android)' });
     if (launcher) out.push({ v:'jdk', t:'Java 17 y herramientas de línea de comandos de Android' });
   }
   return out; } }
];

/* ---------- estado ---------- */
var S = { A:{}, hist:[], view:'device', done:{} };
try { var raw = localStorage.getItem(KEY); if (raw){ var p = JSON.parse(raw); if (p && p.A && p.hist && p.view){ S = p; if (!S.done) S.done = {}; } } } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function qById(id){ for (var i = 0; i < Q.length; i++) if (Q[i].id === id) return Q[i]; return null; }
function applies(q){ return !q.when || q.when(S.A); }
function stopKey(){
  for (var i = 0; i < Q.length; i++){
    var q = Q[i]; if (!applies(q) || q.type === 'multi' || !(q.id in S.A)) continue;
    var o = q.opts(S.A).filter(function(x){ return x.v === S.A[q.id]; })[0];
    if (o && o.stop) return o.stop;
  }
  return null;
}
function nextView(){
  if (stopKey()) return 'STOP';
  for (var i = 0; i < Q.length; i++){ if (applies(Q[i]) && !(Q[i].id in S.A)) return Q[i].id; }
  return 'DONE';
}
function answer(q, value){
  var idx = Q.indexOf(q);
  S.A[q.id] = value;
  for (var i = idx + 1; i < Q.length; i++) delete S.A[Q[i].id];
  S.hist.push(q.id); S.done = {};
  S.view = nextView(); save(); render(true);
}
function back(){
  if (!S.hist.length) return;
  S.view = S.hist.pop(); save(); render(true);
}
function gotoQ(id){
  var i = S.hist.indexOf(id); if (i > -1) S.hist = S.hist.slice(0, i);
  S.view = id; save(); render(true);
}
function restart(){ S = { A:{}, hist:[], view:'device', done:{} }; save(); render(true); }

function chipText(q){
  var v = S.A[q.id], opts = q.opts(S.A);
  if (q.type === 'multi'){ if (!v || !v.length) return 'Nada marcado'; return v.map(function(x){ var o = opts.filter(function(y){ return y.v === x; })[0]; return o ? (o.c || o.t) : x; }).join(', '); }
  var o = opts.filter(function(y){ return y.v === v; })[0]; return o ? (o.c || o.t) : v;
}

/* ---------- contenido: pasos comunes ---------- */
function termName(a){ return a.os === 'win' ? 'PowerShell' : 'Terminal'; }
function openTerm(a){
  return a.os === 'win'
    ? 'Presiona la tecla <strong>Windows</strong>, escribe <strong>PowerShell</strong> y Enter. Para cada comando de esta guía: botón <strong>Copiar</strong>, clic en la ventana azul y <strong>Ctrl + V</strong> (o clic derecho), y Enter.'
    : '⌘ Cmd + espacio, escribe <strong>Terminal</strong> y Enter. Para cada comando de esta guía: botón <strong>Copiar</strong>, clic en la Terminal, ⌘ Cmd + V y Enter.';
}
function prepStep(a, o){
  var win = a.os === 'win', tools = a.tools || [], has = function(x){ return tools.indexOf(x) > -1; }, b = [];
  b.push({ p: openTerm(a) });
  if (win){
    var miss = [], checks = [];
    if (o.tv && !has('python')) miss.push('winget install Python.Python.3.12');
    if (o.tv && !has('git')) miss.push('winget install Git.Git');
    if (!has('adb')) miss.push('winget install Google.PlatformTools');
    if (o.launcher && !has('studio')) miss.push('winget install Google.AndroidStudio');
    if (o.tv){ checks.push('python --version'); checks.push('git --version'); }
    checks.push('adb version');
    if (miss.length){
      b.push({ p:'Instala lo que falta. Si pregunta por los términos de uso, escribe <code>S</code> (o <code>Y</code>) y Enter.' });
      b.push({ cmd: miss.join('\n') });
      b.push({ p:'Cierra PowerShell y ábrela de nuevo para que Windows reconozca lo instalado. Luego comprueba que todo responda con un número de versión:' });
    } else {
      b.push({ p:'Ya tienes lo necesario. Solo comprueba que todo responda con un número de versión:' });
    }
    b.push({ cmd: checks.join('\n') });
    if (o.launcher && !has('studio')) b.push({ note:'info', tag:'Android Studio', html:'Pesa varios GB. Ábrelo una vez y deja que termine la configuración inicial y la descarga del SDK; después puedes cerrarlo. Es lo único que necesita Windows para armar el launcher.' });
    b.push({ note:'warn', tag:'Si "python" abre la Microsoft Store', html:'Windows trae un acceso directo falso. Ve a Configuración → Aplicaciones → Configuración avanzada de aplicaciones → <strong>Alias de ejecución de aplicaciones</strong> y apaga los dos que dicen <em>python</em>. Abre PowerShell otra vez y repite.' });
    b.push({ note:'info', tag:'Si winget no existe o no encuentra adb', html:'Instala o actualiza "Instalador de aplicación" desde la Microsoft Store. Para adb puedes bajar "SDK Platform-Tools for Windows" desde <a href="https://developer.android.com/tools/releases/platform-tools" target="_blank" rel="noopener">developer.android.com</a>, descomprimirlo en <span class="path">C:\\platform-tools</span> y escribir <code>C:\\platform-tools\\adb</code> en lugar de <code>adb</code>.' });
  } else {
    if (!has('brew')){
      b.push({ p:'<strong>Instala Homebrew</strong>, un instalador gratuito de programas. Te pide la contraseña de tu Mac; al escribirla no se ve nada, es normal.' });
      b.push({ cmd:'/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"' });
      b.push({ note:'warn', tag:'Parece congelado, pero no', html:'Si dice <em>"Searching online for the Command Line Tools"</em>, espera. Si luego dice <em>"Press any key when the installation has completed"</em>, no presiones nada todavía: busca la ventana de Apple (a veces queda detrás de la Terminal), dale <strong>Instalar</strong> y espera de 10 a 30 minutos. Cuando diga "Se ha instalado el software", regresa a la Terminal y presiona Enter.' });

    }
    b.push({ p:'Comprueba que todo responda:' });
    b.push({ cmd:'brew --version\nadb version' });

  return { id:'prep', t: a.os === 'win' ? 'Prepara Windows' : 'Prepara la Mac', b:b };

}

function carSteps(a){

  if (!aaos) safe.push({ note:'alert', tag:'Regla práctica: no tocar', html:'No desactives nada del sistema Android ni paquetes cuyo nombre sugiera <em>mcu</em>, <em>can</em>/<em>canbus</em>, <em>radio</em>, <em>bluetooth</em>/<em>bt</em>, <em>camera</em>/<em>avm</em>, <em>steer</em>/<em>volante</em>, <em>amp</em>, <em>carplay</em> o <em>zlink</em>. Controlan funciones del auto. A diferencia de las TVs, aquí no hay listas probadas: desactiva poco y siempre de una en una.' });

  s.push({ id:'seguridad', t:'Antes de empezar: seguridad primero', b:safe });

  s.push({ id:'cardev', t: aaos ? 'Activa el modo desarrollador del auto' : 'Activa el modo desarrollador del radio', b: aaos ? [

               'Entra a <strong>Opciones de desarrollador</strong> y enciende la depuración que ofrezca tu auto (USB o inalámbrica).' ] },
      { note:'info', tag:'Si no aparece', html:'Algunas marcas lo ocultan o lo reservan a la red de concesionarios. En ese caso no hay forma sencilla de seguir: consulta con la marca.' } ] : [
      { list:[ 'Ajustes → <strong>Acerca del dispositivo</strong> (a veces "Información del sistema") → <strong>Número de compilación</strong>: tócalo siete veces seguidas hasta ver el aviso de desarrollador.',
               'Vuelve a Ajustes → Sistema → Opciones de desarrollador y enciende <strong>Depuración USB</strong>. Si existe <strong>Depuración inalámbrica</strong>, enciéndela también.' ] },
      { note:'info', tag:'Si no aparece o pide una clave', html:'Algunas unidades esconden las opciones de desarrollador o piden una clave que depende de la hora: pon primero el reloj del radio en hora. Si sigue sin aparecer, pregunta al vendedor o busca el manual de tu modelo exacto. No pruebes claves al azar en el menú de fábrica.' } ] });

  s.push(prepStep(a, { tv:false, launcher:false }));

  var cb = [];

    var idb = win ? [
      { p:'Averigua qué radio es y guarda la lista de apps:' },
      { cmd:'adb shell getprop ro.product.model\nadb shell getprop ro.build.version.release\nadb shell pm list packages -3 | Sort-Object | Out-File -Encoding ascii apps-instaladas.txt\nadb shell pm list packages -e | Sort-Object | Out-File -Encoding ascii apps-activas.txt' } ] : [
      { p:'Averigua qué radio es y guarda la lista de apps:' },
      { cmd:'adb shell getprop ro.product.model\nadb shell getprop ro.build.version.release\nadb shell pm list packages -3 | sort > apps-instaladas.txt\nadb shell pm list packages -e | sort > apps-activas.txt' } ];
    idb.push({ p:'El archivo <span class="path">apps-instaladas.txt</span> trae solo las apps que se agregaron (no son del sistema Android). Compártelo con Claude junto con el modelo y la versión de Android: te las clasifica en "seguro quitar", "dudoso" y "no tocar". Si <code>adb devices</code> muestra más de un equipo, agrega <code>-s</code> y su nombre a cada comando.' });
    s.push({ id:'carid', t:'Identifica el radio y haz el respaldo', b: idb.concat([
      { p:'Guarda también los ajustes actuales:' },
      { cmd: win ? String.raw`adb shell settings list global | Out-File -Encoding ascii respaldo-global.txt
adb shell settings list secure | Out-File -Encoding ascii respaldo-secure.txt` : 'adb shell settings list global > respaldo-global.txt\nadb shell settings list secure > respaldo-secure.txt' } ]) });
  }

  if (g('apps')){
    s.push({ id:'cardis', t:'Desactiva apps de a poco', b:[
      { p:'Empieza solo por apps que <strong>agregaron</strong> (promociones, tiendas, apps que nunca usas). Un paquete se desactiva así; reemplaza el nombre por el que corresponda:' },
      { cmd:'adb shell pm disable-user --user 0 com.ejemplo.app' },
      { p:'Para devolverlo:' },
      { cmd:'adb shell pm enable com.ejemplo.app' },
      { p:'Para varias apps, guarda los nombres en un archivo (uno por línea, por ejemplo <span class="path">lote1.txt</span>) y aplícalos de una vez. Hazlo en lotes de 2 o 3:' },
      { cmd: win ? 'Get-Content lote1.txt | Where-Object { $_.Trim() } | ForEach-Object { adb shell pm disable-user --user 0 $_.Trim() }' : 'while read -r p; do [ -n "$p" ] && adb shell pm disable-user --user 0 "$p" < /dev/null; done < lote1.txt' },
      { p:'Deshacer el lote completo:' },
      { cmd: win ? 'Get-Content lote1.txt | Where-Object { $_.Trim() } | ForEach-Object { adb shell pm enable $_.Trim() }' : 'while read -r p; do [ -n "$p" ] && adb shell pm enable "$p" < /dev/null; done < lote1.txt' },
      { note:'warn', tag:'Después de cada lote', html:'Reinicia el radio y prueba: sonido, radio AM/FM, cámara de retroceso, botones del volante, Bluetooth, GPS y CarPlay/Android Auto si los usas. Si algo falla, reactiva ese lote al tiro. Si dice <em>Permission Denial</em>, ese paquete no se puede desactivar así: déjalo.' } ] });
  }

  if (g('install')){
    s.push({ id:'carapk', t:'Instala apps desde un archivo APK', b:[
      { p:'Descarga el APK solo desde la tienda oficial de la app o desde el sitio de su autor, y guárdalo en tu computador. Luego instálalo:' },
      { cmd: win ? String.raw`adb install -r "C:\Users\tu-usuario\Downloads\app.apk"` : 'adb install -r ~/Downloads/app.apk' },
      { muted:'Debe responder "Success". Si no funciona, la app puede no ser compatible con la versión de Android del radio.' },
      { note:'alert', tag:'Con el auto detenido', html:'Instala, configura y prueba las apps solo con el auto estacionado. Evita apps de video o que distraigan mientras conduces.' } ] });
  }

  if (g('launcher')){
    s.push({ id:'carlau', t:'Cambia la pantalla de inicio', b:[
      { p:'Instala el launcher que elijas (desde Play Store si tu radio la tiene, o con <code>adb install -r</code> desde su APK oficial) y elígelo como inicio: Ajustes → Aplicaciones → Aplicaciones predeterminadas → <strong>Aplicación de inicio</strong>. La ruta puede variar según el radio.' },
      { note:'warn', tag:'No desactives el launcher original', html:'Los botones del volante, la radio y los accesos a CarPlay o Android Auto suelen apoyarse en él. Pruébalos todos. Si algo falla, vuelve a elegir el inicio original en la misma pantalla.' } ] });
  }

  s.push({ id:'carclose', t:'Cierra bien', b:[ { list:[
    'Desconecta: <code>adb disconnect</code> (si fue por Wi-Fi) y desenchufa el cable (si fue por USB).',
    'En Opciones de desarrollador apaga <strong>Depuración USB</strong> y <strong>Depuración inalámbrica</strong>. Con la depuración encendida, un equipo conectado puede copiar datos e instalar apps sin avisar.',
    'Guarda los archivos de lista y de respaldo: te sirven para deshacer.',
    'Una actualización del radio o del auto puede reactivar apps o borrar cambios. Si pasa, repite el lote.' ] } ] });

  s.push(problemsStep(a));
  return s;
}

/* ---------- problemas ---------- */
function problemsStep(a){
  var win = a.os === 'win', tv = a.device === 'tv', car = a.device === 'car';
  var android = tv && a.tvsys === 'android', launcher = android && a.tvgoal === 'launcher', frame = a.brand === 'tclframe';
  var R = [];
  if (android) R.push(['El interruptor de Depuración inalámbrica se regresa solo','La TV está por cable','Conecta la TV por Wi-Fi']);
  if (win) R.push(['"adb no se reconoce como nombre de un cmdlet"','PowerShell se abrió antes de instalar adb','Cierra PowerShell, ábrela de nuevo y repite']);
  if (win) R.push(['adb no conecta o se queda esperando','El Firewall o el perfil de red "Público" bloquea la conexión','Marca la red como Privada y permite adb en el Firewall']);
  if (win && tv) R.push(['Se abre la Microsoft Store al escribir python','Alias de ejecución de Windows','Apaga los alias de python (paso "Prepara Windows")']);
  if (win && tv) R.push(['"la ejecución de scripts está deshabilitada"','Política de ejecución de PowerShell','Usa el comando completo con <code>powershell -ExecutionPolicy Bypass -File …</code>']);
  if (!win) R.push(['"No route to host"','macOS bloquea la red local','Privacidad y seguridad → Red local → Terminal']);
  if (launcher) R.push(['"Skipping … setupwraith"','Una red Wi-Fi guardada es del asistente','Olvida esa red en la TV y repite']);
  if (launcher) R.push(['"shell command too long" al aplicar el tema','Se está usando la conexión de Google ADB para mandar fotos', win ? '<code>Remove-Item Env:TV_ADB_BINARY</code> y repite' : '<code>unset TV_ADB_BINARY</code> y repite']);
  if (frame) R.push(['El botón Frame no hace nada','Se desactivó <code>com.tcl.exhibit</code>','<code>pm enable com.tcl.exhibit</code>']);
  if (launcher) R.push(['El fondo no cambia','Solo rota con la pantalla de inicio a la vista','Espera en inicio 1–2 min sin tocar el control']);
  if (tv) R.push(['Se perdió la conexión','La TV se reinició o cayó el Wi-Fi','Repite "Vincula/Conecta" y "Fija el puerto 5555"']);
  if (car){
    R.push(['adb dice <code>unauthorized</code>','El radio aún no aceptó este computador','Acepta el aviso en la pantalla del radio; si no sale, apaga y enciende la depuración']);
    R.push(['El radio no aparece con el cable USB','Cable que solo carga, puerto sin modo periférico u otro problema de conexión', win ? 'Prueba otro cable de datos y el otro puerto USB. Si Windows no lo reconoce, instala el controlador USB de Google desde Android Studio (SDK Manager → SDK Tools)' : 'Prueba otro cable de datos y el otro puerto USB del radio']);
    R.push(['<em>Permission Denial</em> al desactivar','Ese paquete está protegido','Déjalo como está']);
    R.push(['Después de un lote falla el sonido, la cámara o el volante','Se desactivó algo que no debía','Reactiva el lote con <code>pm enable</code> y reinicia. Si el radio no arranca, el último recurso es el restablecimiento de fábrica (borra tu configuración)']);
    R.push(['No aparecen las Opciones de desarrollador','La unidad las oculta o pide una clave','Pon el reloj en hora; si sigue igual, pregunta al vendedor o revisa el manual del modelo']);
  }
  return { id:'problemas', t:'Si algo sale mal', nocheck:true, b:[ { table:{ head:['Ves esto','Qué pasa','Solución'], rows:R } } ] };
}

/* ---------- pantallas de aviso ---------- */
var STOPS = {
  'tv-other': { t:'Tu TV no usa Android', b:[
    { p:'Samsung (Tizen), LG (webOS), Roku, Vizio y Hisense VIDAA no aceptan adb, así que esta guía no sirve para ellas.' },
    { p:'Sí hay una forma de apagar el rastreo desde el control remoto. El proyecto CleanYourTV tiene una guía para eso: <a href="https://cleanyour.tv/not-android" target="_blank" rel="noopener">cleanyour.tv/not-android</a>. No necesitas computador.' },
    { note:'info', tag:'¿Y si en realidad sí es Android?', html:'Algunas TVs de esas marcas venden modelos con Google TV. Si tu TV tiene la Play Store, vuelve atrás y elige "Google TV o Android TV".' } ] },
  'tv-unknown': { t:'Cómo saber qué sistema tiene tu TV', b:[
    { list:[ 'Si el menú de inicio dice <strong>Google TV</strong> o <strong>Android TV</strong>, o hay una tienda <strong>Google Play</strong>, es Android.',
             'Si el menú es de Amazon, es <strong>Fire TV</strong>.',
             'Si es de Samsung, LG o Roku, o el menú lo dibuja la marca sin Play Store, no es Android.',
             'Mira en Ajustes → Sistema → Información, o busca en internet el modelo exacto (viene en la etiqueta de atrás) junto con las palabras "sistema operativo".' ] },
    { muted:'Cuando lo sepas, vuelve atrás y elige la opción correcta.' } ] },
  'car-phone': { t:'Con CarPlay o Android Auto casi no hay nada que limpiar', b:[
    { p:'Si el radio solo muestra lo que viene del celular, no tiene apps propias que desactivar. Lo que sí puedes ordenar está en el celular:' },
    { list:[ '<strong>iPhone:</strong> Ajustes → General → CarPlay → tu auto → Personalizar, para ordenar u ocultar apps.',
             '<strong>Android:</strong> Ajustes → Dispositivos conectados → Preferencias de conexión → Android Auto, y ahí la opción para personalizar el inicio.' ] },
    { muted:'Los nombres exactos cambian un poco con la versión del sistema. Si además tu auto trae un sistema propio, vuelve atrás y elige el tipo que corresponda.' } ] },
  'car-unknown': { t:'Cómo saber qué radio tienes', b:[
    { list:[ 'Si tiene una pantalla grande con Ajustes de Android, <strong>Play Store</strong> o se pueden instalar apps, y la compraste e instalaste después, es un <strong>radio Android</strong>.',
             'Si el auto trae Google integrado de fábrica (Maps, Assistant y Play Store dentro de la pantalla), es <strong>Android Automotive</strong>.',
             'Si solo muestra la radio y, al conectar el celular, CarPlay o Android Auto, es de <strong>solo CarPlay o Android Auto</strong>.' ] },
    { muted:'Cuando lo sepas, vuelve atrás y elige la opción correcta.' } ] }
};

/* ---------- render ---------- */
var app = document.getElementById('app'), pbar = document.getElementById('pbar');

function header(){
  var h = el('div', 'head');
  h.appendChild(el('div', 'eyebrow', 'Guía interactiva <b>/ TV y radio de auto · Windows y Mac</b>'));
  h.appendChild(el('h1', null, 'Limpia tu TV o tu radio de auto'));
  h.appendChild(el('p', 'lead', 'Responde unas preguntas y recibe solo los pasos que necesitas, con los comandos de tu computador.'));
  return h;
}
function setProgress(pct){ pbar.style.width = Math.max(0, Math.min(100, pct)) + '%'; }

function renderQuestion(q){
  var wrap = el('section', 'qcard');
  var applicable = Q.filter(applies), answered = applicable.filter(function(x){ return x.id in S.A; }).length;
  var n = applicable.indexOf(q) + 1;
  wrap.appendChild(el('div', 'qmeta', 'Pregunta ' + n));
  wrap.appendChild(el('h2', null, q.t));
  if (q.h) wrap.appendChild(el('p', 'muted', q.h));
  var opts = q.opts(S.A), box = el('div', 'opts'), multi = q.type === 'multi';
  var sel = multi ? (S.A[q.id] ? S.A[q.id].slice() : []) : [S.A[q.id]];
  var cont;
  opts.forEach(function(o){
    var b = el('button', 'opt' + (multi ? ' multi' : '')); b.type = 'button';
    var on = sel.indexOf(o.v) > -1;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.appendChild(el('span', 'mark', on ? '✓' : ''));
    b.appendChild(el('span', 'ot', o.t));
    if (o.s) b.appendChild(el('span', 'os', o.s));
    b.addEventListener('click', function(){
      if (!multi){ answer(q, o.v); return; }
      var i = sel.indexOf(o.v); if (i > -1) sel.splice(i, 1); else sel.push(o.v);
      var now = sel.indexOf(o.v) > -1; b.setAttribute('aria-pressed', now ? 'true' : 'false'); b.firstChild.textContent = now ? '✓' : '';
      cont.disabled = sel.length < (q.min || 0);
    });
    box.appendChild(b);
  });
  wrap.appendChild(box);
  var row = el('div', 'row');
  if (S.hist.length){ var bk = el('button', 'btn', '← Atrás'); bk.type = 'button'; bk.addEventListener('click', back); row.appendChild(bk); }
  if (multi){
    cont = el('button', 'btn primary', 'Continuar'); cont.type = 'button'; cont.disabled = sel.length < (q.min || 0);
    cont.addEventListener('click', function(){ answer(q, sel.slice()); });
    row.appendChild(cont);
  }
  if (row.childNodes.length) wrap.appendChild(row);
  setProgress(answered / Math.max(applicable.length, 1) * 100);
  return wrap;
}

function renderChips(){
  var sum = el('div', 'sum');
  sum.appendChild(el('div', 'qmeta', 'Tus respuestas (toca una para cambiarla)'));
  var chips = el('div', 'chips');
  Q.forEach(function(q){
    if (!applies(q) || !(q.id in S.A)) return;
    var c = el('button', 'chip', chipText(q)); c.type = 'button';
    c.addEventListener('click', function(){ gotoQ(q.id); });
    chips.appendChild(c);
  });
  sum.appendChild(chips);
  return sum;
}

function renderStop(){
  var d = STOPS[stopKey()], wrap = el('section', 'qcard');
  wrap.appendChild(el('h2', null, d.t));
  d.b.forEach(function(b){ wrap.appendChild(mkBlock(b)); });
  var row = el('div', 'row');
  var bk = el('button', 'btn primary', '← Volver y cambiar la respuesta'); bk.type = 'button'; bk.addEventListener('click', back); row.appendChild(bk);
  var rs = el('button', 'btn', 'Empezar de nuevo'); rs.type = 'button'; rs.addEventListener('click', restart); row.appendChild(rs);
  wrap.appendChild(row);
  setProgress(100);
  return wrap;
}

function renderResult(){
  var frag = document.createDocumentFragment();
  var steps = S.A.device === 'tv' ? tvSteps(S.A) : carSteps(S.A);
  var checkable = steps.filter(function(x){ return !x.nocheck; });
  var sum = renderChips();
  var meter = el('div', 'bar'), mspan = el('span'); meter.appendChild(mspan);
  var cnt = el('div', 'qmeta', '');
  sum.appendChild(cnt); sum.appendChild(meter);
  var row = el('div', 'row');
  var bk = el('button', 'btn', '← Atrás'); bk.type = 'button'; bk.addEventListener('click', back); row.appendChild(bk);
  var rs = el('button', 'btn', 'Empezar de nuevo'); rs.type = 'button'; rs.addEventListener('click', restart); row.appendChild(rs);
  sum.appendChild(row);
  frag.appendChild(sum);

  function refresh(){
    var d = checkable.filter(function(x){ return S.done[x.id]; }).length;
    cnt.textContent = 'Tu guía: ' + d + ' de ' + checkable.length + ' pasos hechos';
    mspan.style.width = (d / Math.max(checkable.length, 1) * 100) + '%';
    setProgress(d / Math.max(checkable.length, 1) * 100);
  }

  var cards = [];
  steps.forEach(function(st, i){
    var card = el('section', 'step' + (S.done[st.id] ? ' done' : '')); card.id = 'st-' + st.id;
    var sh = el('div', 'sh'); sh.appendChild(el('div', 'num', String(i + 1))); sh.appendChild(el('h2', null, st.t)); card.appendChild(sh);
    var sb = el('div', 'sb'); st.b.forEach(function(b){ sb.appendChild(mkBlock(b)); }); card.appendChild(sb);
    if (!st.nocheck){
      var lb = el('label', 'donelbl'), cb = el('input'); cb.type = 'checkbox'; cb.id = 'done-' + st.id; cb.checked = !!S.done[st.id];
      lb.appendChild(cb); lb.appendChild(document.createTextNode('Paso hecho'));
      cb.addEventListener('change', function(){
        S.done[st.id] = cb.checked; card.classList.toggle('done', cb.checked); save(); refresh();
        if (cb.checked){
          var nx = cards[i + 1]; if (nx){ var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; nx.scrollIntoView({ behavior: rm ? 'auto' : 'smooth', block:'start' }); }
        }
      });
      card.appendChild(lb);
    }
    cards.push(card); frag.appendChild(card);
  });
  refresh();
  return frag;
}

function render(scroll){
  app.textContent = '';
  app.appendChild(header());
  var v = S.view;
  if (v !== 'STOP' && v !== 'DONE' && !qById(v)) v = S.view = nextView();
  if (v === 'DONE' || (v !== 'STOP' && nextView() === 'DONE' && !qById(v))) { app.appendChild(renderResult()); }
  else if (v === 'STOP') app.appendChild(renderStop());
  else app.appendChild(renderQuestion(qById(v)));
  if (scroll) window.scrollTo(0, 0);
}
render(false);
})();
</script>
</body>
